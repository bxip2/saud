<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرافق</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell for drivers and attendants of disability transport vehicles: sticky brand bar, scrolling view, fixed 5-tab bar. Deep accessibility blue with mint surfaces; amber only for highlights; red reserved for emergencies. */
:root {
  --bg: #E8EDF3;
  --shell: #F5F8FB;
  --surface: #FFFFFF;
  --surface-2: #EDF2F8;
  --fg: #0F1E33;
  --muted: #4A5A70;
  --line: #D2DCE8;
  --brand: #1D4E89;
  --brand-2: #2A66AE;
  --brand-soft: #DCE7F5;
  --on-brand: #FFFFFF;
  --amber: #8F5609;
  --amber-soft: #FAEBD2;
  --danger: #B0281B;
  --danger-soft: #FCE5E1;
  --ok: #1D6B3A;
  --ok-soft: #DDF1E3;
  --shadow: 0 1px 2px rgba(15,30,51,.06), 0 6px 18px rgba(15,30,51,.06);
  --display: 'El Messiri', 'IBM Plex Sans Arabic', Tahoma, serif;
  --body: 'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070D16; --shell: #0B1420; --surface: #121F31; --surface-2: #17283E; --fg: #E6EEF8; --muted: #9FB0C6; --line: #25384F;
    --brand: #5B95D8; --brand-2: #78ABE6; --brand-soft: #18304F; --on-brand: #06121F; --amber: #EFB65C; --amber-soft: #3A2A12;
    --danger: #FF8E80; --danger-soft: #3E1712; --ok: #7FD69B; --ok-soft: #173622; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070D16; --shell: #0B1420; --surface: #121F31; --surface-2: #17283E; --fg: #E6EEF8; --muted: #9FB0C6; --line: #25384F;
  --brand: #5B95D8; --brand-2: #78ABE6; --brand-soft: #18304F; --on-brand: #06121F; --amber: #EFB65C; --amber-soft: #3A2A12;
  --danger: #FF8E80; --danger-soft: #3E1712; --ok: #7FD69B; --ok-soft: #173622; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; line-height: 1.6; margin: 0; padding-inline: 0; padding-block: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.app { max-width: 520px; margin-inline: auto; min-height: 100vh; background: var(--shell); display: flex; flex-direction: column; position: relative; }
body.large .app { zoom: 1.16; }
@media (min-width: 640px) { .app { margin-block: 24px; min-height: calc(100vh - 48px); border-radius: 28px; overflow: hidden; box-shadow: 0 20px 60px rgba(15,30,51,.18); border: 1px solid var(--line); } }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: color-mix(in srgb, var(--shell) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(145deg, #2A66AE, #1D4E89); display: grid; place-items: center; flex: none; }
.brand b { display: block; font-family: var(--display); font-size: 20px; line-height: 1.15; }
.brand small { display: block; font-size: 12px; color: var(--muted); }
.hbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; min-height: 40px; cursor: pointer; font-size: 14px; font-weight: 600; flex: none; }

main { flex: 1; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.view-enter { animation: enter .2s ease-out; }
@keyframes enter { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view-enter { animation: none; } }

h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 24px; line-height: 1.25; }
h3 { font-size: 17px; line-height: 1.35; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.sec-h { display: flex; flex-direction: column; gap: 2px; }
.num { font-variant-numeric: tabular-nums; font-weight: 700; direction: ltr; unicode-bidi: isolate; }

.hero { background: linear-gradient(150deg, #2A66AE 0%, #1D4E89 70%); color: #FFFFFF; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset-inline-end: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 24px solid rgba(255,255,255,.08); }
.hero h1 { font-family: var(--display); font-size: 25px; line-height: 1.25; }
.hero p { opacity: .92; font-size: 14px; }
.hero .hbtns { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero .hb { border: 0; background: #FFFFFF; color: #1D4E89; border-radius: 14px; padding: 10px 16px; min-height: 46px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.hero .hb.ghost { background: rgba(255,255,255,.16); color: #FFFFFF; }
.prog { height: 8px; border-radius: 999px; background: rgba(255,255,255,.22); overflow: hidden; }
.prog i { display: block; height: 100%; background: #F2C26B; border-radius: 999px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; direction: ltr; unicode-bidi: isolate; }

.sos { display: flex; align-items: center; gap: 10px; background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); border-radius: 18px; padding: 10px 12px; }
.sos .lbl { font-weight: 700; color: var(--danger); flex: 1; min-width: 0; }
.callbtn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 700; color: #FFFFFF; background: #B0281B; border-radius: 12px; padding: 8px 14px; min-height: 44px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.callbtn.ghost { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }

.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.etile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 6px; min-height: 104px; cursor: pointer; box-shadow: var(--shadow); }
.etile:active { transform: scale(.98); }
.etile .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.etile.crit .ic { background: var(--danger-soft); color: var(--danger); }
.etile b { font-size: 13.5px; line-height: 1.3; }
.action { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; cursor: pointer; box-shadow: var(--shadow); color: inherit; text-decoration: none; }
.action .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.action div { flex: 1; min-width: 0; }
.action b { display: block; }
.action span.s { display: block; font-size: 13px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--danger); color: #FFFFFF; font-size: 13px; font-weight: 700; }
.chev { color: var(--muted); flex: none; }
[dir="rtl"] .chev { transform: scaleX(-1); }
.banner { display: flex; gap: 8px; align-items: center; background: var(--brand-soft); color: var(--brand); border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.banner.amber { background: var(--amber-soft); color: var(--amber); }
.banner.red { background: var(--danger-soft); color: var(--danger); }
.tip { background: var(--amber-soft); border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; }
.tip .ic { color: var(--amber); flex: none; margin-top: 2px; }

.flowtop { display: flex; align-items: center; gap: 10px; }
.back { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: none; }
[dir="rtl"] .back svg { transform: scaleX(-1); }
.callbox { background: var(--danger-soft); border: 1.5px solid var(--danger); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.callbox h3 { color: var(--danger); display: flex; align-items: center; gap: 8px; }
.callbox ul, .dont ul { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
.steps li { display: flex; gap: 12px; align-items: flex-start; counter-increment: s; }
.steps li::before { content: counter(s); flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.dont { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.dont h4 { color: var(--danger); font-size: 14px; display: flex; gap: 6px; align-items: center; }
.kitchips { display: flex; flex-wrap: wrap; gap: 8px; }
.kchip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.kchip .ic { color: var(--brand); display: grid; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchips button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; min-height: 40px; font-size: 14px; cursor: pointer; }
.pchips button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.plan { background: var(--brand-soft); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.plan b { color: var(--brand); }
.stimer { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; border-radius: 20px; background: var(--surface); border: 2px solid var(--brand); text-align: center; }
.stimer.warn { border-color: var(--danger); background: var(--danger-soft); }
.stimer .t { font-family: var(--display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; direction: ltr; }
.stimer.warn .t { color: var(--danger); }

.btns { display: flex; flex-direction: column; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 12px 18px; min-height: 52px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.secondary { background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); }
.btn.danger { background: #B0281B; color: #FFFFFF; }
.btn.wa { background: #1E8E4E; color: #FFFFFF; }
.btn.sm { min-height: 40px; padding: 6px 14px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }

.checks { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; min-height: 52px; }
.check input { width: 22px; height: 22px; accent-color: var(--brand); flex: none; margin: 0; }
.check.on { border-color: var(--ok); background: var(--ok-soft); }
.check.key { border-color: var(--danger); }
.check.key.on { border-color: var(--ok); }

.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.red { background: var(--danger-soft); color: var(--danger); }
.tag.blue { background: var(--brand-soft); color: var(--brand); }
.dl { margin: 0; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: 6px 12px; font-size: 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; white-space: pre-wrap; }

.form { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .field > .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input[type=text], .field input[type=tel], .field input[type=date], .field textarea, .field select { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 46px; width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--brand); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; min-height: 40px; background: var(--surface); }
.chips input { accent-color: var(--brand); margin: 0; width: 18px; height: 18px; flex: none; }
.chips label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.privacy { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }

.cgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 20px; padding: 14px 6px; min-height: 118px; cursor: pointer; text-align: center; }
.cbtn .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; }
.cbtn b { font-size: 15px; line-height: 1.3; }
.pain { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; }
.pain button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 10px; font-weight: 700; color: #FFFFFF; cursor: pointer; font-variant-numeric: tabular-nums; font-size: 15px; padding: 0; }
.bodyp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bodyp button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 52px; font-weight: 600; cursor: pointer; }

.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.seg button { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: 14px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.kstat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kstat div { border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.kstat b { font-family: var(--display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.kstat span { font-size: 12px; font-weight: 600; }
details.item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
details.item summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; min-height: 58px; }
details.item summary::-webkit-details-marker { display: none; }
details.item summary .ic { width: 36px; height: 36px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
details.item summary b { flex: 1; min-width: 0; font-size: 15px; }
.st { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.st.ok { background: var(--ok-soft); color: var(--ok); }
.st.soon { background: var(--amber-soft); color: var(--amber); }
.st.bad { background: var(--danger-soft); color: var(--danger); }
.st.none { background: var(--surface-2); color: var(--muted); }
details.item .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.caution { background: var(--amber-soft); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.caution b { color: var(--amber); }
.msgbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; }
.list { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.numrow { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
.numrow .n { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--danger); min-width: 64px; font-variant-numeric: tabular-nums; direction: ltr; text-align: center; }
.numrow div { flex: 1; min-width: 0; }
.numrow div > span { display: block; }
.log { display: flex; flex-direction: column; gap: 6px; }
.log div { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.log .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.log time { margin-inline-start: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.tabs { position: fixed; bottom: 0; inset-inline: 0; z-index: 10; display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.tabs .in { width: 100%; max-width: 520px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 10px; min-height: 64px; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; }
.tabs button .tic { width: 44px; height: 30px; border-radius: 999px; display: grid; place-items: center; }
.tabs button[aria-current="page"] { color: var(--brand); }
.tabs button[aria-current="page"] .tic { background: var(--brand-soft); }
.tabs button.sos-tab { color: var(--danger); }
.tabs button.sos-tab[aria-current="page"] .tic { background: var(--danger-soft); }
@media (min-width: 640px) { .tabs { position: sticky; } }

.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(5, 12, 22, .55); display: grid; place-items: end center; }
.sheet { width: 100%; max-width: 520px; background: var(--shell); border-radius: 26px 26px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 92vh; overflow: auto; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.langs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.langs button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 8px; min-height: 76px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.langs button b { font-size: 18px; }
.langs button span { font-size: 12px; color: var(--muted); }
.langs button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.agree { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.agree li { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.agree li svg { color: var(--brand); flex: none; margin-top: 2px; }
.full { position: fixed; inset: 0; z-index: 45; background: #FFFFFF; color: #111; display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); gap: 16px; overflow: auto; }
.full .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; text-align: center; }
.full .big { font-family: var(--display); font-size: clamp(40px, 11vw, 64px); line-height: 1.25; direction: rtl; }
.full .en { font-size: clamp(22px, 6vw, 32px); color: #333; direction: ltr; }
.full .ur { font-size: 22px; color: #555; direction: rtl; }
.full .closem { background: #1D4E89; color: #FFF; border: 0; border-radius: 12px; padding: 8px 16px; font-weight: 700; min-height: 44px; cursor: pointer; }
.full .icbig { width: 120px; height: 120px; border-radius: 32px; display: grid; place-items: center; }
.medic table { width: 100%; border-collapse: collapse; font-size: 18px; }
.medic th { text-align: start; font-size: 13px; color: #555; font-weight: 600; padding: 10px 0 2px; }
.medic td { padding: 0 0 10px; font-weight: 700; border-bottom: 1px solid #E3E3E3; overflow-wrap: anywhere; white-space: pre-wrap; }

      var condIds = CONDS.map(function (c) { return c.id; });
      state.pax = (Array.isArray(d.pax) ? d.pax : []).slice(0, 60).map(function (p, i) { return { id: Number(p.id) || Date.now() + i, name: str(p.name, 80), dis: DIS.some(function (x) { return x.id === p.dis; }) ? p.dis : "", wheel: !!p.wheel, comm: COMM.some(function (x) { return x.id === p.comm; }) ? p.comm : "", conds: (Array.isArray(p.conds) ? p.conds : []).filter(function (c) { return condIds.indexOf(c) !== -1; }), allergy: str(p.allergy, 80), meds: str(p.meds, 600), plan: str(p.plan, 600), notes: str(p.notes, 600), gname: str(p.gname, 80), gphone: str(p.gphone, 30) }; }).filter(function (p) { return p.name; });
      var kit = {}; if (d.kit && typeof d.kit === "object") Object.keys(ITEMS).forEach(function (k) { var x = d.kit[k]; if (x) kit[k] = { used: !!x.used, exp: /^\d{4}-\d{2}-\d{2}$/.test(x.exp || "") ? x.exp : "" }; });
      state.kit = kit;
      state.reports = (Array.isArray(d.reports) ? d.reports : []).slice(0, 30).filter(function (r) { return guide(r.g); }).map(function (r) { return { g: r.g, pax: str(r.pax, 80), amb: !!r.amb, ts: Number(r.ts) || Date.now() }; });
      if (VERSIONS.some(function (v) { return v.id === d.version; })) state.version = d.version;
      if (LI[d.lang] !== undefined) state.lang = d.lang;
      if (d.veh) state.veh = { org: str(d.veh.org, 80), no: str(d.veh.no, 30), driver: str(d.veh.driver, 60) };
      ["pax", "kit", "reports", "version", "lang", "veh"].forEach(function (k) { store(k, state[k]); }); store("onboarded", true); store("agreed", Date.now()); keepStorage();
      return true;
    } catch (e) { return false; }
  }
  function deleteAll() {
    KEYS.forEach(function (k) { try { localStorage.removeItem("mf-" + k); } catch (e) {} });
    state.pax = []; state.kit = {}; state.reports = []; state.trip = { phase: "idle", checks: [], start: 0, last: false }; state.veh = { org: "", no: "", driver: "" }; state.version = "vehicle"; state.view = null; state.tab = "home"; state.large = false; document.body.classList.remove("large");
    var msg = t("delDone"); state.lang = null; applyLang(); render(); openLang(true); toast(msg);
  }
  function openSettings() {
    layer.innerHTML = '<div class="overlay" role="dialog" aria-modal="true"><div class="sheet"><div class="row between"><h2>' + esc(t("setT")) + '</h2><button type="button" class="btn secondary sm" data-closelayer>' + esc(t("close")) + "</button></div>" +
      '<form class="card form" id="vehform"><h3>' + esc(t("setVeh")) + '</h3><div class="field"><label for="s-org">' + esc(t("fOrg")) + '</label><input type="text" id="s-org" name="org" maxlength="80" value="' + esc(state.veh.org) + '"></div><div class="field"><label for="s-no">' + esc(t("fVeh")) + '</label><input type="text" id="s-no" name="no" maxlength="30" value="' + esc(state.veh.no) + '"></div><div class="field"><label for="s-dr">' + esc(t("fDriver")) + '</label><input type="text" id="s-dr" name="driver" maxlength="60" value="' + esc(state.veh.driver) + '"></div><button type="submit" class="btn secondary sm">' + esc(t("save")) + "</button></form>" +
      '<div class="card"><div class="chips"><label><input type="checkbox" id="bigtext"' + (state.large ? " checked" : "") + ">" + esc(t("bigText")) + "</label></div></div>" +
      '<section class="card stack"><h3>' + icon("lock", 18) + " " + esc(t("privT")) + "</h3><p>" + esc(t("privB")) + "</p>" + (STORE_OK ? "" : '<div class="banner red">' + icon("alert", 16) + "<span>" + esc(t("storBad")) + "</span></div>") + "</section>" +
      '<section class="card stack"><h3>' + esc(t("bkT")) + '</h3><p class="small muted">' + esc(t("bkB")) + '</p><div class="codebox" id="bkcode">' + esc(backupCode()) + '</div><button type="button" class="btn secondary sm" data-bkcopy>' + icon("copy", 18) + esc(t("bkCopy")) + "</button>" +
      '<form class="form" id="rsform"><div class="field"><label class="sr" for="rscode">' + esc(t("rsPh")) + '</label><textarea id="rscode" name="code" dir="ltr" placeholder="' + esc(t("rsPh")) + '"></textarea></div><p class="small" id="rsmsg" role="status" style="color:var(--danger)" hidden></p><button type="submit" class="btn secondary sm">' + esc(t("rsBtn")) + "</button></form></section>" +
      '<p class="small muted">' + esc(CONFIG.reviewedBy ? t("reviewed").replace("{name}", CONFIG.reviewedBy).replace("{date}", CONFIG.reviewedOn) : t("pending")) + " " + esc(t("foot")) + "</p>" +
      '<button type="button" class="btn secondary" style="color:var(--danger);border-color:var(--danger)" data-delask>' + esc(t("delT")) + '</button><div class="card stack" id="delconfirm" hidden><p>' + esc(t("delAsk")) + '</p><div class="btns"><button type="button" class="btn danger" data-delyes>' + esc(t("delYes")) + '</button><button type="button" class="btn secondary" data-closelayer>' + esc(t("cancel")) + "</button></div></div></div></div>";
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("button, a"); if (!el) return;
    var d = el.dataset;
    if (d.lang) { state.lang = d.lang; store("lang", d.lang); layer.innerHTML = ""; applyLang(); render(); if (!load("onboarded", false)) { state.onboard = load("agreed", 0) ? 1 : 9; openOnboard(); } return; }
    if (el.id === "langbtn") return openLang(false);
    if (el.id === "setbtn") return openSettings();
    if (d.closelayer !== undefined) { layer.innerHTML = ""; return; }
    if (d.obagree !== undefined) { store("agreed", Date.now()); state.onboard = 1; return openOnboard(); }
    if (d.obskip !== undefined) return finishOnboard();
    if (d.version) { state.version = d.version; store("version", d.version); if (state.onboard) return openOnboard(); return render(); }
    if (d.tab) return go(d.tab);
    if (d.back !== undefined) { var bv = state.view; if (bv && bv.name === "report" && bv.from) { state.view = bv.from; return render(); } if (bv && bv.name === "paxEdit" && bv.id) { state.view = { name: "paxShow", id: bv.id }; return render(); } state.view = null; return render(); }
    if (d.open === "check") return open({ name: "check" });
    if (d.guide) { if (state.tab !== "home" && !d.gp) { state.tab = "home"; renderTabs(); } return open({ name: "guide", id: d.guide, pax: d.gp || (state.pax.length === 1 && state.pax[0].conds.some(function (c) { var o = CONDS.filter(function (x) { return x.id === c; })[0]; return o && o.g === d.guide; }) ? state.pax[0].id : "") }); }
    if (d.gpax !== undefined) { state.view.pax = d.gpax; return render(); }
    if (d.tstart !== undefined) { state.view.tStart = Date.now(); state.view.tEnd = 0; return render(); }
    if (d.tstop !== undefined) { state.view.tEnd = Date.now(); return render(); }
    if (d.report !== undefined) { var gv = state.view; return open({ name: "report", g: gv.id, pax: gv.pax, dur: gv.tStart ? mmss((gv.tEnd || Date.now()) - gv.tStart) : "", from: gv }); }
    if (d.item) { go("kit"); var det = document.getElementById("item-" + d.item); if (det) { det.open = true; det.scrollIntoView({ block: "center" }); } return; }
    if (d.starttrip !== undefined) { state.trip.phase = "on"; state.trip.start = Date.now(); state.trip.last = false; store("trip", state.trip); state.view = null; return render(); }
    if (d.endtrip !== undefined) return open({ name: "check" });
    if (d.confirmend !== undefined) { state.trip = { phase: "idle", checks: [], start: 0, last: false }; store("trip", state.trip); state.trips.n++; state.trips.d = today; store("trips", state.trips); state.view = null; render(); return toast(t("tripEnded")); }
    if (d.paxedit !== undefined) return open({ name: "paxEdit", id: d.paxedit });
    if (d.paxshow) return open({ name: "paxShow", id: d.paxshow });
    if (d.paxrm) { state.pax = state.pax.filter(function (p) { return String(p.id) !== d.paxrm; }); store("pax", state.pax); state.view = null; return render(); }
    if (d.medic) return openMedic(d.medic);
    if (d.card) { var c = CARDS.filter(function (x) { return x.id === d.card; })[0]; return openFull(bigText(c.t, c.ic, c.col, c.bg)); }
    if (d.pain) { var n = d.pain; return openFull('<div class="icbig" style="background:#FCE5E1;color:#B0281B;font-family:var(--display);font-size:64px">' + n + "</div>" + bigText([S.painOf[0].replace("{n}", n), S.painOf[1].replace("{n}", n), S.painOf[2].replace("{n}", n)])); }
    if (d.bodyp) { var b = BODY[+d.bodyp]; return openFull(bigText(["الألم في " + b[0].replace(/ي$/, "ي"), "It hurts: " + b[1].toLowerCase(), "درد: " + b[2]], "bolt", "#B0281B", "#FCE5E1")); }
    if (d.refill !== undefined) return open({ name: "refill" });
    if (d.refilled !== undefined) { refillList().forEach(function (id) { var k = state.kit[id] || {}; k.used = false; if (itemStatus(id) !== "used") k.exp = ""; state.kit[id] = k; }); store("kit", state.kit); state.view = null; state.tab = "kit"; renderTabs(); return render(); }
    if (d.copy !== undefined) return copyText(document.getElementById("pmsg"));
    if (d.bkcopy !== undefined) return copyText(document.getElementById("bkcode"));
    if (d.delask !== undefined) { document.getElementById("delconfirm").hidden = false; el.hidden = true; return; }
    if (d.delyes !== undefined) return deleteAll();
  });
  document.addEventListener("change", function (e) {
    var el = e.target, d = el.dataset || {};
    if (d.tc !== undefined) { var i = +d.tc, a = state.trip.checks, p = a.indexOf(i); if (el.checked && p === -1) a.push(i); if (!el.checked && p !== -1) a.splice(p, 1); store("trip", state.trip); el.closest(".check").classList.toggle("on", el.checked); var all = a.length === CHECKS.length; document.getElementById("gobtn").style.display = all ? "" : "none"; document.getElementById("gobtn2").style.display = all ? "none" : ""; }
    if (d.lastcheck !== undefined) { state.trip.last = el.checked; store("trip", state.trip); el.closest(".check").classList.toggle("on", el.checked); view.querySelector("[data-confirmend]").disabled = !el.checked; }
    if (d.exp) { var k = state.kit[d.exp] || {}; k.exp = el.value; state.kit[d.exp] = k; store("kit", state.kit); keepStorage(); var det = el.closest("details"); render(); var nd = document.getElementById(det.id); if (nd) nd.open = true; }
    if (d.used) { var k2 = state.kit[d.used] || {}; k2.used = el.checked; state.kit[d.used] = k2; store("kit", state.kit); var det2 = el.closest("details"); render(); var nd2 = document.getElementById(det2.id); if (nd2) nd2.open = true; }
    if (el.id === "bigtext") { state.large = el.checked; store("large", state.large); document.body.classList.toggle("large", state.large); }
  });
  document.addEventListener("submit", function (e) {
    var f = e.target, fd = new FormData(f);
    if (f.id === "paxform") {
      e.preventDefault();
      var name = String(fd.get("name") || "").trim().slice(0, 80); if (!name) { document.getElementById("p-name").focus(); return; }
      var id = state.view.id ? Number(state.view.id) : Date.now();
      var p = { id: id, name: name, dis: String(fd.get("dis") || ""), wheel: !!fd.get("wheel"), comm: String(fd.get("comm") || ""), conds: fd.getAll("conds").map(String), allergy: str(fd.get("allergy"), 80).trim(), meds: str(fd.get("meds"), 600).trim(), plan: str(fd.get("plan"), 600).trim(), notes: str(fd.get("notes"), 600).trim(), gname: str(fd.get("gname"), 80).trim(), gphone: str(fd.get("gphone"), 30).trim() };
      var ix = state.pax.findIndex(function (x) { return x.id === id; }); if (ix === -1) state.pax.push(p); else state.pax[ix] = p;
      store("pax", state.pax); keepStorage(); state.view = { name: "paxShow", id: id }; render(); toast(t("saved")); return;
    }
    if (f.id === "repform") {
      e.preventDefault();
      var v = state.view, g = guide(v.g), pax = paxById(fd.get("pax"));
      var lines = [t("repT") + " — " + (g ? tr(g.t) : "")];
      lines.push(t("repTime") + ": " + new Date().toLocaleString(state.lang === "ar" ? "ar-SA-u-nu-latn-ca-gregory" : state.lang === "ur" ? "ur-PK" : "en-GB"));
      if (pax) lines.push(t("repPax") + ": " + pax.name);
      if (state.veh.org) lines.push(t("fOrg") + ": " + state.veh.org);
      if (state.veh.no) lines.push(t("repVehicle") + ": " + state.veh.no);
      if (state.veh.driver) lines.push(t("repDriver") + ": " + state.veh.driver);
      if (v.dur) lines.push(t("lasted").replace("{t}", v.dur));
      var what = String(fd.get("what") || "").trim(), done = String(fd.get("done") || "").trim();
      if (what) lines.push("", t("repWhat") + " " + what);
      if (done) lines.push(t("repDone") + " " + done);
      lines.push("", t("rep997") + ": " + (fd.get("amb") ? t("yes") : t("no")), t("repGuard") + ": " + (fd.get("guard") ? t("yes") : t("no")));
      v.msg = lines.join("\n");
      state.reports.unshift({ g: v.g, pax: pax ? pax.name : "", amb: !!fd.get("amb"), ts: Date.now() }); state.reports = state.reports.slice(0, 30); store("reports", state.reports);
      render(); var m = document.getElementById("pmsg"); if (m) m.scrollIntoView({ block: "center" }); return;
    }
    if (f.id === "obform") { e.preventDefault(); state.veh = { org: str(fd.get("org"), 80).trim(), no: str(fd.get("no"), 30).trim(), driver: str(fd.get("driver"), 60).trim() }; store("veh", state.veh); return finishOnboard(); }
    if (f.id === "vehform") { e.preventDefault(); state.veh = { org: str(fd.get("org"), 80).trim(), no: str(fd.get("no"), 30).trim(), driver: str(fd.get("driver"), 60).trim() }; store("veh", state.veh); toast(t("saved")); return; }
    if (f.id === "rsform") { e.preventDefault(); if (restore(fd.get("code"))) { layer.innerHTML = ""; state.view = null; applyLang(); render(); toast(t("rsOk")); } else { var rm = document.getElementById("rsmsg"); rm.textContent = t("rsBad"); rm.hidden = false; } }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && layer.innerHTML && state.lang && !state.onboard) layer.innerHTML = ""; });

  applyLang();
  render();
  if (!state.lang) openLang(true);
})();
</script>
